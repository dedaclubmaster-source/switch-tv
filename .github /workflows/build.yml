name: Build Switch TV

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        run: make

      - name: Upload homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: switch-tv-nro
          path: switch-tv.nro
          if-no-files-found: error
